services:
  - type: web
    name: railway-signaling-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Set your MongoDB Atlas connection string in Render Dashboard (Environment tab)
      # or leave unset to use the built-in resilient database
